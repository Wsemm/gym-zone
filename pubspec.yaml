name: gym_zones
description: Gym Zones

publish_to: "none"
version: 3.1.0+11

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  archive: ^3.6.1
  cached_network_image: ^3.3.1
  carousel_slider: ^5.0.0
  device_info_plus: ^10.1.2
  easy_debounce: ^2.0.3
  firebase_auth: ^5.3.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter:
    sdk: flutter
  flutter_otp_text_field: ^1.1.3+2
  flutter_plugin_android_lifecycle: ^2.0.18
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.10+1
  fluttertoast: ^8.2.6
  geolocator: ^12.0.0
  get: ^4.6.6
  get_storage: ^2.1.1
  google_sign_in: ^6.2.0
  http: ^1.2.1
  image_picker: ^1.1.2
  infinite_scroll_pagination: ^4.0.0
  intl: ^0.19.0
  lottie: ^3.1.2
  package_info_plus: ^8.0.0
  percent_indicator: ^4.2.3
  permission_handler: ^11.3.1
  photo_view: ^0.14.0
  qr_code_scanner_plus: ^2.0.3
  sign_in_with_apple: ^6.1.0
  smooth_page_indicator: ^1.1.0
  upgrader: ^11.4.0
  url_launcher: ^6.3.0
  webview_flutter: ^4.9.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  min_sdk_android: 23
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/launcher-icon.png"
  adaptive_icon_background: "#ffffff"

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#222332"
  image: "assets/images/splash-image-primary.png"
  image_dark: "assets/images/splash-image-white.png"
  android: true
  ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/json/
    - shorebird.yaml

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  fonts:
    - family: tajwal
      fonts:
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200

    - family: lato
      fonts:
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
